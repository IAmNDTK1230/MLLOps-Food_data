# Additive Review-2 stack. Provision external network/volumes with Terraform first.
services:
  qwen:
    networks: [default, foody_devops]
  rag-backend:
    image: foody-rag-review2:local
    build:
      context: .
      dockerfile: Dockerfile.devops
      args:
        BASE_IMAGE: ${FOODY_BASE_IMAGE:-shopee-data-mlops-platform-rag-backend:latest}
    environment:
      QWEN_BASE_URL: http://qwen:8193
      FOODY_DATABASE_URL: postgresql://foody:${FOODY_DB_PASSWORD:-foody_local_demo}@postgres:5432/foody
      FOODY_KAFKA_BOOTSTRAP: kafka:19092
      GIT_SHA: ${GIT_SHA:-unknown}
    networks: [default, foody_devops]
  streamlit:
    image: foody-rag-review2:local
    environment:
      FOODY_STREAMLIT_METRICS_PORT: "8002"
      FOODY_DATABASE_URL: postgresql://foody:${FOODY_DB_PASSWORD:-foody_local_demo}@postgres:5432/foody
    networks: [default, foody_devops]
  postgres:
    image: postgres:17.11-alpine3.23
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: foody
      POSTGRES_PASSWORD: ${FOODY_DB_PASSWORD:-foody_local_demo}
      POSTGRES_DB: foody
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foody -d foody"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - foody_postgres_data:/var/lib/postgresql/data
    networks: [foody_devops]
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://127.0.0.1:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_MS: "21600000"
      KAFKA_LOG_RETENTION_BYTES: "134217728"
      KAFKA_LOG_SEGMENT_BYTES: "16777216"
      KAFKA_LOG_INDEX_SIZE_MAX_BYTES: "1048576"
      KAFKA_NUM_PARTITIONS: "1"
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    volumes:
      - foody_kafka_data:/var/lib/kafka/data
    networks: [foody_devops]
  kafka-consumer:
    image: foody-rag-review2:local
    command: python -m src.streaming.consumer
    restart: unless-stopped
    environment:
      FOODY_DATABASE_URL: postgresql://foody:${FOODY_DB_PASSWORD:-foody_local_demo}@postgres:5432/foody
      FOODY_KAFKA_BOOTSTRAP: kafka:19092
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/metrics', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [foody_devops]
  prometheus:
    image: prom/prometheus:v3.5.5
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=6h", "--storage.tsdb.retention.size=256MB", "--web.enable-lifecycle"]
    volumes:
      - ./devops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - foody_prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks: [foody_devops]
  grafana:
    image: grafana/grafana:12.2.9
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${FOODY_GRAFANA_PASSWORD:-foody_local_demo}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - foody_grafana_data:/var/lib/grafana
      - ./devops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./devops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks: [foody_devops]
networks:
  foody_devops:
    external: true
    name: foody_devops_network
volumes:
  foody_postgres_data: {external: true}
  foody_kafka_data: {external: true}
  foody_prometheus_data: {external: true}
  foody_grafana_data: {external: true}
