global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: foody-api
    static_configs:
      - targets: ["rag-backend:8000"]
  - job_name: foody-streamlit
    static_configs:
      - targets: ["streamlit:8002"]
  - job_name: foody-kafka-consumer
    static_configs:
      - targets: ["kafka-consumer:8001"]
